{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1>My Profile</h1>
  <p>Keep your details up to date</p>
</div>

<div class="bb-card" style="max-width:600px;margin:0 auto;">
  <div class="bb-card-header">Profile Details</div>
  <div class="bb-card-body">
    <form method="POST" action="{{ url_for('donor.profile') }}">
      <h6 class="mb-3 text-muted">Personal Info</h6>
      <div class="mb-3">
        <label class="bb-label" for="name">Full Name</label>
        <input class="bb-input" type="text" id="name" name="name" value="{{ user.name }}" required>
      </div>
      <div class="mb-3">
        <label class="bb-label" for="phone">Phone</label>
        <input class="bb-input" type="tel" id="phone" name="phone" value="{{ user.phone or '' }}">
      </div>

      <h6 class="mb-3 mt-4 text-muted">Donor Details</h6>
      <div class="mb-3">
        <label class="bb-label" for="blood_group">Blood Group</label>
        <select class="bb-select" id="blood_group" name="blood_group">
          {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
          <option value="{{ bg }}" {% if donor and donor.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="bb-label" for="age">Age</label>
          <input class="bb-input" type="number" id="age" name="age" min="18" max="65" value="{{ donor.age if donor else '' }}">
        </div>
        <div class="col-6">
          <label class="bb-label" for="weight">Weight (kg)</label>
          <input class="bb-input" type="number" id="weight" name="weight" min="45" value="{{ donor.weight if donor else '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="bb-label" for="city">City</label>
        <input class="bb-input" type="text" id="city" name="city" value="{{ donor.city if donor else '' }}">
      </div>
      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="available" name="available"
          {% if donor and donor.available %}checked{% endif %}>
        <label class="form-check-label bb-label" for="available">Available to donate</label>
      </div>

      <button type="submit" class="btn-bb-primary w-100">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
