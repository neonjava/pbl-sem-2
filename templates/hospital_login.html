<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Login - LifeSaver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-hospital"></i>
                <h2>Hospital Access</h2>
                <p style="color: var(--gray); margin-top: 5px;">Manage your blood stock and SOS alerts.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert" style="background: #fee2e2; color: #dc2626; text-align: center;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Hospital Username</label>
                    <input type="text" name="username" placeholder="e.g. citycare" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Login to Hospital Dashboard</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Need donor access? <a href="/login" style="color: var(--primary); font-weight: 700; text-decoration: none;">Go to Donor Login</a>
            </div>
        </div>
    </div>
</body>
</html>
