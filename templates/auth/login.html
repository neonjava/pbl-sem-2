{% extends "base.html" %}

{% block public_content %}
<div class="page-header">
  <h1>Sign In</h1>
  <p>Welcome back to BloodBridge</p>
</div>

<div class="bb-card" style="max-width:440px;margin:0 auto;">
  <div class="bb-card-header">Login to your account</div>
  <div class="bb-card-body">
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="bb-label" for="email">Email Address</label>
        <input class="bb-input" type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="bb-label" for="password">Password</label>
        <input class="bb-input" type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-bb-primary w-100">Sign In</button>
    </form>
    <p class="text-center mt-3" style="font-size:0.9rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
