<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Network - LifeSaver</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px;">
            <div class="auth-header">
                <i class="fa-solid fa-droplet"></i>
                <h2>Become a Lifesaver</h2>
                <p style="color: var(--gray); margin-top: 5px;">Static demo form.</p>
            </div>

            <div class="alert" style="background: #fee2e2; color: #dc2626; text-align: center; display: none; margin-bottom: 1rem;" id="regAlert"></div>

            <form onsubmit="return handleRegister(event);">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Display Username</label>
                        <input type="text" id="username" placeholder="e.g. donor_01" required>
                    </div>
                    <div class="form-group">
                        <label>Account Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Legal Name</label>
                    <input type="text" id="full_name" placeholder="As per ID proofs" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <div style="display: flex; gap: 5px;">
                            <span style="padding: 0.8rem; background: #eee; border-radius: 12px; font-weight: 700; color: #555;">+91</span>
                            <input type="text" id="phone" placeholder="10 Digit Number" required pattern="\d{10}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Blood Group</label>
                        <select id="blood_type" required>
                            <option value="">Select...</option>
                            <option value="A+">A Positive (A+)</option>
                            <option value="A-">A Negative (A-)</option>
                            <option value="B+">B Positive (B+)</option>
                            <option value="B-">B Negative (B-)</option>
                            <option value="O+">O Positive (O+)</option>
                            <option value="O-">O Negative (O-)</option>
                            <option value="AB+">AB Positive (AB+)</option>
                            <option value="AB-">AB Negative (AB-)</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" placeholder="e.g. Mumbai" required>
                    </div>
                    <div class="form-group">
                        <label>Area / Locality</label>
                        <input type="text" id="area" placeholder="e.g. Bandra" required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label>Fitness & Health Clearance Certificate (PDF/Image)</label>
                    <input type="file" id="certificate" accept=".pdf,image/*" required>
                    <span style="font-size: 0.75rem; color: var(--gray); display: block; margin-top: 4px;">Please upload an official declaration that you are fit to donate blood.</span>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 1rem;">Complete Registration</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Already a member? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log In here</a>
            </div>
        </div>
    </div>

    <script src="assets/js/db.js"></script>
    <script>
        function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const fullName = document.getElementById("full_name").value;
            const phone = document.getElementById("phone").value;
            const bloodType = document.getElementById("blood_type").value;
            const city = document.getElementById("city").value;
            const area = document.getElementById("area").value;
            const certFile = document.getElementById("certificate").files[0];
            const alertBox = document.getElementById("regAlert");

            if (!certFile) {
                alertBox.textContent = "Please upload a fitness certificate.";
                alertBox.style.display = "block";
                return false;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const certDataUrl = e.target.result;
                const res = registerDonor(username, password, fullName, phone, bloodType, city, area, certDataUrl);
                if (res.success) {
                    localStorage.setItem("flash_message", "Welcome! Your Test ID is " + res.tempId);
                    localStorage.setItem("flash_type", "success");
                    window.location.href = "login.html";
                } else {
                    alertBox.textContent = res.message;
                    alertBox.style.display = "block";
                }
            };
            reader.readAsDataURL(certFile);
            return false;
        }
    </script>
</body>
</html>
