<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard - LifeSaver</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stock-table td, .stock-table th { padding: 12px; text-align: left; }
        .stock-table th { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; }
        .mini-btn { padding: 6px 10px; font-size: 0.75rem; border-radius: 8px; border: none; cursor: pointer; }
        .mini-btn.primary { background: var(--primary); color: #fff; }
        .mini-btn.muted { background: #e2e8f0; color: #334155; }
        .chip { padding: 4px 10px; border-radius: 999px; background: #fee2e2; color: #dc2626; font-size: 0.7rem; font-weight: 700; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="brand">
            <i class="fa-solid fa-hospital"></i>
            <span>Hospital Control Center</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="text-align: right;">
                <div style="font-weight: 700;" id="hospName">--</div>
                <div style="font-size: 0.75rem; color: var(--gray);" id="hospDetails">--</div>
            </div>
            <a href="#" onclick="handleLogout(event);" style="color: var(--primary); font-size: 1.2rem;" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </header>

    <main class="main-content">
        <div class="hero-section" style="background: var(--secondary); padding: 1.6rem;">
            <div>
                <h1 style="font-size: 1.8rem; margin-bottom: 0.2rem;">Blood Stock & SOS Tracker</h1>
                <p style="opacity: 0.8; font-size: 0.9rem;">Update live blood availability and respond to emergency requests.</p>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px;">
                <span style="font-size: 0.8rem;">OPEN SOS</span>
                <div style="font-size: 1.4rem; font-weight: 800;" id="sosCount">0</div>
            </div>
        </div>

        <div class="alert alert-success" style="display: none; margin-bottom: 1.2rem;" id="actionAlert"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: #fee2e2; color: #dc2626;">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div>
                    <div style="color: var(--gray); font-size: 0.85rem; font-weight: 600;">Stock Types</div>
                    <div style="font-size: 1.8rem; font-weight: 800;" id="statStockTypes">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e1f5fe; color: #0288d1;">
                    <i class="fa-solid fa-phone-volume"></i>
                </div>
                <div>
                    <div style="color: var(--gray); font-size: 0.85rem; font-weight: 600;">Contact</div>
                    <div style="font-size: 1rem; font-weight: 800;" id="statContact">--</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e8f5e9; color: #2e7d32;">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <div style="color: var(--gray); font-size: 0.85rem; font-weight: 600;">Hospital ID</div>
                    <div style="font-size: 1.2rem; font-weight: 800;" id="statHospId">--</div>
                </div>
            </div>
        </div>

        <div class="info-grid">
            <div class="card" style="padding: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">Live Blood Stock</h3>
                <form onsubmit="return handleAddStock(event);" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 1rem;">
                    <select id="add_blood_type" required>
                        <option value="">Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                    <input type="number" id="add_units" min="0" placeholder="Units" required>
                    <button class="mini-btn primary" type="submit" style="display: flex; align-items: center; justify-content: center; gap: 5px;"><i class="fa-solid fa-plus"></i> Add</button>
                </form>

                <table class="stock-table" style="width: 100%; border-collapse: collapse;">
                    <thead style="background: #f8fafc;">
                        <tr>
                            <th>Blood Group</th>
                            <th>Units</th>
                            <th>Last Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Dynamic Stock -->
                    </tbody>
                </table>
            </div>

            <div class="card" style="padding: 1.5rem;">
                <h3 style="margin-bottom: 1rem;">Emergency SOS Requests</h3>
                <div id="sosListContainer" style="display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto;">
                    <!-- Dynamic SOS Requests -->
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/db.js"></script>
    <script>
        const hospital = getCurrentHospital();
        if (!hospital) {
            window.location.href = "hospital_login.html";
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderDashboard();
        });

        function renderDashboard() {
            // Header & Profile
            document.getElementById("hospName").textContent = hospital.hospital_name;
            document.getElementById("hospDetails").textContent = `${hospital.city} | ${hospital.hospital_id}`;
            document.getElementById("statContact").textContent = hospital.contact;
            document.getElementById("statHospId").textContent = hospital.hospital_id;

            // Load Stock
            const stock = getHospitalStock(hospital.id);
            document.getElementById("statStockTypes").textContent = stock.length;

            const stockBody = document.getElementById("stockTableBody");
            if (stock.length === 0) {
                stockBody.innerHTML = `<tr><td colspan="4" style="padding: 20px; text-align: center; color: var(--gray);">No stock records added yet.</td></tr>`;
            } else {
                stockBody.innerHTML = stock.map(item => `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="font-weight: 700; color: var(--primary);">${item.blood_type}</td>
                        <td>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <input type="number" id="units_${item.id}" min="0" value="${item.units}" style="width: 80px; padding: 6px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                <button class="mini-btn primary" onclick="handleUpdateStock(${item.id})"><i class="fa-solid fa-pen"></i></button>
                            </div>
                        </td>
                        <td style="font-size: 0.8rem; color: var(--gray);">${item.last_updated}</td>
                        <td>
                            <button class="mini-btn muted" onclick="handleDeleteStock(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join("");
            }

            // Load SOS
            const sosList = getSOS();
            document.getElementById("sosCount").textContent = sosList.length;

            const sosContainer = document.getElementById("sosListContainer");
            if (sosList.length === 0) {
                sosContainer.innerHTML = `<div style="color: var(--gray); font-size: 0.85rem;">No SOS requests right now.</div>`;
            } else {
                sosContainer.innerHTML = sosList.map(req => `
                    <div style="border: 1px solid #fee2e2; border-radius: 16px; padding: 12px; background: #fffafa;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-weight: 800;">${req.requester_name}</div>
                            <span class="chip">${req.blood_type} | ${req.units_needed}U</span>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--gray); margin-top: 4px;">${req.city} · ${req.contact}</div>
                        <div style="font-size: 0.85rem; margin-top: 6px;">${req.notes || "No extra notes."}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <div style="font-size: 0.75rem; color: var(--gray);">Created: ${req.created_at}</div>
                            <button class="mini-btn muted" onclick="handleResolveSOS(${req.id})"><i class="fa-solid fa-check"></i> Resolve</button>
                        </div>
                    </div>
                `).join("");
            }
        }

        function showAlert(msg) {
            const alertBox = document.getElementById("actionAlert");
            alertBox.textContent = msg;
            alertBox.style.display = "block";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 3000);
        }

        function handleAddStock(event) {
            event.preventDefault();
            const bloodType = document.getElementById("add_blood_type").value;
            const units = document.getElementById("add_units").value;

            addStockItem(hospital.id, bloodType, units);
            showAlert("Blood stock added.");
            document.getElementById("add_blood_type").value = "";
            document.getElementById("add_units").value = "";
            renderDashboard();
            return false;
        }

        function handleUpdateStock(stockId) {
            const units = document.getElementById(`units_${stockId}`).value;
            updateStockItem(stockId, units);
            showAlert("Stock updated.");
            renderDashboard();
        }

        function handleDeleteStock(stockId) {
            if (confirm("Are you sure you want to delete this stock record?")) {
                deleteStockItem(stockId);
                showAlert("Stock removed.");
                renderDashboard();
            }
        }

        function handleResolveSOS(sosId) {
            deleteSOS(sosId);
            showAlert("SOS request cleared.");
            renderDashboard();
        }

        function handleLogout(event) {
            event.preventDefault();
            logout();
            window.location.href = "hospital_login.html";
        }
    </script>
</body>
</html>
