<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LifeSaver Portal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-heart-pulse"></i>
                <h2>Donor Login</h2>
                <p style="color: var(--gray); margin-top: 5px;">Static demo screen.</p>
            </div>

            <div class="alert" style="background: #fee2e2; color: #dc2626; text-align: center; display: none; margin-bottom: 1rem;" id="loginAlert"></div>

            <form onsubmit="return handleLogin(event);">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Sign In to Dashboard</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                New to the community? <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register Now</a>
            </div>
            <div style="text-align: center; margin-top: 0.8rem; font-size: 0.85rem;">
                <a href="sos.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Emergency SOS</a>
                <span style="color: var(--gray); padding: 0 6px;">|</span>
                <a href="hospital_login.html" style="color: var(--secondary); font-weight: 700; text-decoration: none;">Hospital Login</a>
            </div>
        </div>
    </div>

    <script src="assets/js/db.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const flashMsg = localStorage.getItem("flash_message");
            if (flashMsg) {
                const alertBox = document.getElementById("loginAlert");
                alertBox.textContent = flashMsg;
                alertBox.style.background = "#d1fae5";
                alertBox.style.color = "#065f46";
                alertBox.style.display = "block";
                localStorage.removeItem("flash_message");
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const alertBox = document.getElementById("loginAlert");

            const res = loginUser(user, pass);
            if (res.success) {
                if (res.role === "admin") {
                    window.location.href = "admin_dashboard.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } else {
                alertBox.textContent = res.message;
                alertBox.style.display = "block";
            }
            return false;
        }
    </script>
</body>
</html>
